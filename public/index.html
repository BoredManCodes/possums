<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f0">
  <title>Possums</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="topbar__back" id="topbar-back" aria-label="Back" hidden>‹</button>
    <h1 class="topbar__title" id="topbar-title">Possums</h1>
    <div class="topbar__sub" id="topbar-sub"></div>
  </header>

  <main id="app">
    <p class="placeholder">Loading&hellip;</p>
  </main>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab is-active" data-tab="today">
      <svg viewBox="0 0 24 24" class="tab__icon" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V11z"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="sleep">
      <svg viewBox="0 0 24 24" class="tab__icon" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <span>Sleep</span>
    </button>
    <button class="tab tab--add" data-action="add" aria-label="Add activity">
      <span class="tab__add">+</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" class="tab__icon" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24" class="tab__icon" aria-hidden="true"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div class="sheet" id="add-sheet" aria-hidden="true">
    <div class="sheet__backdrop" data-action="close-sheet"></div>
    <div class="sheet__panel" role="dialog" aria-label="Add activity">
      <div class="sheet__handle"></div>
      <h2 class="sheet__title">What happened?</h2>
      <div class="sheet__grid" id="add-grid"></div>
      <button class="sheet__cancel" data-action="close-sheet">Cancel</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
